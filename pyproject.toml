[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dissertation-rag"
version = "0.1.0"
description = "Research platform for detecting and mitigating knowledge poisoning in RAG-based cybersecurity systems."
requires-python = ">=3.12,<3.13"
dependencies = [
    "langchain",
    "langchain-community",
    "langchain-openai",
    "langchain-huggingface",
    "langchain-qdrant",
    "qdrant-client",
    "sentence-transformers",
    "streamlit",
    "requests",
    "python-dotenv",
    "pandas",
    "fastapi",
    "uvicorn[standard]",
    "langchain-text-splitters",
    "textattack",
    "tensorflow_hub",
    "tensorflow",
    # entropy-filter defence (app/defence/entropy_filter.py); also run:
    #   python -m nltk.downloader wordnet
    "wordfreq",
    "nltk",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
# Code added from October 2026 is formatted at the standard width; earlier files keep
# their original hand-written layout (see DECISIONS.md, ADR-011).
line-length = 88
